<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경제시사 데일리</title>
<meta name="description" content="매일 아침 정리하는 경제 시사 브리핑: 한눈에 보는 핵심 뉴스, 도표, 이해도 퀴즈">
<meta name="theme-color" content="#12a37f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar → hero card → market tiles → "한눈에 보기" cards + score → story cards (icon header, figures, quiz) + side panels.
   Friendly, rounded look: round Korean faces, pill buttons, 16–24px radii, soft tinted icon bubbles per category.
   Korean market colors: red = up, blue = down. */
:root {
  --bg: #f3f6f9;
  --surface: #ffffff;
  --ink: #1e2532;
  --muted: #667085;
  --line: #e3e8ef;
  --accent: #12a37f;
  --accent-ink: #0b7a5f;
  --accent-soft: #e2f6ef;
  --butter: #fff4d6;
  --butter-ink: #8a5a00;
  --up: #e5484d;
  --down: #3b6ff0;
  --bar-muted: #c3cbd6;
  --ok: #12a37f;
  --ok-soft: #e2f6ef;
  --bad: #e5484d;
  --bad-soft: #fdeceb;
  --shadow: 0 1px 2px rgba(20, 30, 50, .04), 0 4px 14px rgba(20, 30, 50, .06);
  --c-policy: #12a37f;
  --c-market: #8b5cf6;
  --c-fx: #f08c00;
  --c-trade: #0ea5c6;
  --c-estate: #e0609a;
  --c-global: #4f6ef0;
  --c-reg: #7a9a1e;
  --r-lg: 24px; --r-md: 16px; --r-sm: 12px;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1b212b; --ink: #e9edf3; --muted: #9aa4b2; --line: #2a323e;
    --accent: #34c79f; --accent-ink: #5fe0bb; --accent-soft: #163a31; --butter: #3a3120; --butter-ink: #ffd27a;
    --up: #ff6b6b; --down: #6f9bff; --bar-muted: #465060; --ok: #34c79f; --ok-soft: #163a31;
    --bad: #ff7b7b; --bad-soft: #3d1f22; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    --c-policy: #34c79f; --c-market: #a98bff; --c-fx: #ffad42; --c-trade: #3cc8e6;
    --c-estate: #f086b8; --c-global: #8199ff; --c-reg: #b4cf55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1b212b; --ink: #e9edf3; --muted: #9aa4b2; --line: #2a323e;
  --accent: #34c79f; --accent-ink: #5fe0bb; --accent-soft: #163a31; --butter: #3a3120; --butter-ink: #ffd27a;
  --up: #ff6b6b; --down: #6f9bff; --bar-muted: #465060; --ok: #34c79f; --ok-soft: #163a31;
  --bad: #ff7b7b; --bad-soft: #3d1f22; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  --c-policy: #34c79f; --c-market: #a98bff; --c-fx: #ffad42; --c-trade: #3cc8e6;
  --c-estate: #f086b8; --c-global: #8199ff; --c-reg: #b4cf55;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  overflow-x: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-ink); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px;
}
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 16px; height: 16px; }
.ic.lg { width: 24px; height: 24px; }
.disp { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px;
  align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-logo { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: #fff;
  display: grid; place-items: center; }
.brand-name { font-family: var(--font-display); font-size: 23px; line-height: 1; }
.brand-name small { display: block; font-family: var(--font-body); font-size: 12px; color: var(--muted); margin-top: 3px; }
.nav { display: flex; align-items: center; gap: 4px; background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px; }
.nav button { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; color: var(--ink); }
.nav button:hover:not(:disabled) { background: var(--surface); }
.nav button:disabled { opacity: .3; cursor: default; }
.nav button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.nav select { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 0; border-radius: 999px;
  padding: 6px 14px; cursor: pointer; box-shadow: var(--shadow); }

.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 64px; }

/* Hero */
.hero { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 26px 28px;
  display: grid; gap: 12px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
  background: var(--accent-soft); z-index: 0; }
.hero > * { position: relative; z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 14px; width: fit-content; }
.pill.mint { background: var(--accent-soft); color: var(--accent-ink); }
.pill.butter { background: var(--butter); color: var(--butter-ink); }
.hero h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4.2vw, 36px); line-height: 1.35; margin: 0;
  text-wrap: balance; max-width: 28em; }
.hero p { margin: 0; max-width: 46em; font-size: 17px; }

/* Market tiles */
.markets { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-top: 16px; }
.mk { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.mk-top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.mk-ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--bg); color: var(--muted); }
.mk-value { font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.mk-chg { font-size: 14px; font-variant-numeric: tabular-nums; }
.up-t { color: var(--up); } .down-t { color: var(--down); } .flat-t { color: var(--muted); }
.mk-note { font-size: 12px; color: var(--muted); }
.basis { font-size: 13px; color: var(--muted); margin: 8px 4px 0; }

/* Category tints */
[data-cat="통화정책"] { --cat: var(--c-policy); }
[data-cat="금융시장"] { --cat: var(--c-market); }
[data-cat="외환"] { --cat: var(--c-fx); }
[data-cat="무역·산업"] { --cat: var(--c-trade); }
[data-cat="부동산"] { --cat: var(--c-estate); }
[data-cat="글로벌"] { --cat: var(--c-global); }
[data-cat="정책·규제"] { --cat: var(--c-reg); }
.bubble { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none;
  color: var(--cat, var(--accent)); background: color-mix(in srgb, var(--cat, var(--accent)) 14%, var(--surface)); }
.bubble.sm { width: 32px; height: 32px; border-radius: 11px; }
.cat { font-size: 14px; color: var(--cat, var(--accent)); }

/* Section heads */
.sec { margin-top: 30px; display: grid; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.sec-title { display: flex; align-items: center; gap: 10px; }
.sec-title h3 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; }
.sec-title .bubble { --cat: var(--accent); }
.score { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); box-shadow: var(--shadow);
  border-radius: 20px; padding: 6px 8px 6px 14px; font-size: 14px; }
.score .ic { color: #f5b301; fill: #f5b301; stroke: #f5b301; }
.score-bar { width: 120px; height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.score-bar i { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 0; border-radius: 999px;
  padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--line); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border-radius: var(--r-md);
  box-shadow: var(--shadow); padding: 16px; display: grid; gap: 8px; align-content: start;
  transition: transform .15s ease, box-shadow .15s ease; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
.card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(20,30,50,.06), 0 10px 24px rgba(20,30,50,.10); }
.card:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-title { font-family: var(--font-display); font-size: 18px; line-height: 1.45; text-wrap: balance; }
.card-sum { font-size: 14px; color: var(--muted); line-height: 1.6; }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 2px; font-size: 13px; color: var(--muted); }
.qbadge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px; background: var(--butter); color: var(--butter-ink); }
.qbadge.done { background: var(--ok-soft); color: var(--accent-ink); }

/* Body grid */
.grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; margin-top: 30px; align-items: start; }
#read { scroll-margin-top: var(--top-h, 60px); }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.tabbar { position: sticky; top: var(--top-h, 60px); z-index: 5; margin: 0 -10px 14px; padding: 10px 10px;
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 0 0 20px 20px; }
.tabbar.stuck { box-shadow: 0 8px 14px -10px rgba(20, 30, 50, .25); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px; }
@media (max-width: 640px) {
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
}
.chip { font: inherit; font-size: 14px; padding: 6px 14px 6px 10px; border-radius: 999px; cursor: pointer; border: 0;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px; }
.chip .ic { color: var(--cat, var(--accent)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.chip[aria-pressed="true"] .ic { color: inherit; }

.stories { display: grid; gap: 16px; }
.story { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 22px 24px;
  display: grid; gap: 14px; scroll-margin-top: calc(var(--top-h, 60px) + 74px); }
@media (max-width: 520px) { .story { padding: 18px 16px; } .hero { padding: 22px 18px; } }
.story-head { display: flex; gap: 12px; align-items: flex-start; }
.story-head > div { display: grid; gap: 2px; }
.story h3 { font-family: var(--font-display); font-weight: 400; font-size: 23px; line-height: 1.4; margin: 0; text-wrap: balance; }
.story p { margin: 0; }
.note { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--r-sm); padding: 12px 14px; font-size: 15px; }
.note .ic { margin-top: 3px; }
.note b { font-family: var(--font-display); font-weight: 400; margin-right: 6px; }
.note.why { background: var(--accent-soft); }
.note.why .ic, .note.why b { color: var(--accent-ink); }
.note.pt { background: var(--butter); }
.note.pt .ic, .note.pt b { color: var(--butter-ink); }
.src { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.src a { text-decoration: none; background: var(--bg); border-radius: 999px; padding: 2px 10px; color: var(--ink); }
.src a:hover { background: var(--line); }

/* Figures */
.figs { display: grid; gap: 10px; }
.fig { margin: 0; padding: 14px 16px 12px; background: var(--bg); border-radius: var(--r-md); }
.fig figcaption { font-family: var(--font-display); font-size: 16px; margin-bottom: 8px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig svg text { font-family: var(--font-body); fill: var(--ink); }
.fig svg .t-muted { fill: var(--muted); }
.fig svg .t-num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.fig svg .t-big { font-family: var(--font-display); }
.fig svg .grid-line { stroke: var(--line); stroke-width: 1; }
.fig svg .axis { stroke: var(--muted); stroke-width: 1; }
.fill-up { fill: var(--up); } .fill-down { fill: var(--down); }
.fill-accent { fill: var(--accent); } .fill-muted { fill: var(--bar-muted); }
.stroke-accent { stroke: var(--accent); }
.fig-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow li { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.flow .step { background: var(--surface); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow); }
.flow li:last-child .step { background: var(--accent); color: #fff; font-family: var(--font-display); }
.flow .arr { color: var(--muted); display: grid; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 2px; }
.stat-l { font-size: 13px; color: var(--muted); }
.stat-v { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat-s { font-size: 12px; color: var(--muted); }
.cmp { display: grid; gap: 8px; }
.cmp-row { background: var(--surface); border-radius: var(--r-sm); padding: 10px 14px; display: grid;
  grid-template-columns: minmax(90px, 1.2fr) auto auto auto; align-items: center; gap: 4px 12px; }
.cmp-l { color: var(--muted); font-size: 14px; }
.cmp-from { color: var(--muted); font-variant-numeric: tabular-nums; }
.cmp-arr { color: var(--muted); display: grid; }
.cmp-to { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.cmp-note { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
@media (max-width: 480px) { .cmp-row { grid-template-columns: 1fr auto auto auto; } }

/* Quiz */
.quiz { border-radius: var(--r-md); border: 2px dashed color-mix(in srgb, var(--accent) 40%, var(--line)); padding: 16px; display: grid; gap: 16px; }
.quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.quiz-head .t { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 18px; }
.quiz-head .t .ic { color: #f5b301; }
.qitem { display: grid; gap: 8px; }
.qtext { font-size: 16px; font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { font: inherit; font-size: 15px; text-align: left; cursor: pointer; color: var(--ink); background: var(--bg);
  border: 2px solid transparent; border-radius: 999px; padding: 8px 16px 8px 8px; display: flex; gap: 10px; align-items: center; }
.opt:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.opt:disabled { cursor: default; }
.opt .n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 14px; color: var(--muted); flex: none; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.right .n { background: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt.wrong .n { background: var(--bad); color: #fff; }
.opt .mark { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
.opt.right .mark { color: var(--accent-ink); } .opt.wrong .mark { color: var(--bad); }
.explain { font-size: 14px; border-radius: var(--r-sm); padding: 10px 14px; background: var(--bg); }
.explain b { font-family: var(--font-display); font-weight: 400; margin-right: 6px; }
.explain.ok b { color: var(--accent-ink); } .explain.no b { color: var(--bad); }

/* Side */
aside { display: grid; gap: 16px; position: sticky; top: calc(var(--top-h, 60px) + 16px); }
@media (max-width: 880px) { aside { position: static; } }
.panel { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px 20px; }
.panel-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel-head h4 { font-family: var(--font-display); font-weight: 400; font-size: 19px; margin: 0; }
.panel-head .bubble { --cat: var(--accent); width: 34px; height: 34px; border-radius: 11px; }
.panel dl { margin: 0; display: grid; gap: 12px; }
.panel dt { font-family: var(--font-display); font-size: 16px; }
.panel dd { margin: 2px 0 0; font-size: 14px; color: var(--muted); line-height: 1.65; }
.cal { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cal li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; font-size: 14px; }
.cal .when { font-family: var(--font-display); font-size: 14px; background: var(--butter); color: var(--butter-ink);
  border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 999px; padding: 4px 14px; }
.search-box .ic { color: var(--muted); }
.search-box input { all: unset; flex: 1; font: inherit; font-size: 15px; padding: 6px 0; color: var(--ink); min-width: 0; }
.hits { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.hits button { all: unset; cursor: pointer; display: block; border-radius: var(--r-sm); padding: 6px 10px; }
.hits button:hover { background: var(--bg); }
.hits button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); }
.h-date { font-size: 12px; color: var(--muted); display: block; }

.state { margin-top: 40px; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 28px; color: var(--muted); }
.state strong { color: var(--ink); display: block; font-family: var(--font-display); font-weight: 400; font-size: 20px; margin-bottom: 4px; }
footer { margin-top: 40px; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="./" aria-label="경제시사 데일리 처음으로">
      <span class="brand-logo" id="logo"></span>
      <span class="brand-name">경제시사 데일리<small>매일 아침 경제 뉴스 한 장</small></span>
    </a>
    <nav class="nav" aria-label="호 이동">
      <button id="prev" type="button" disabled aria-label="이전 호"></button>
      <select id="pick" disabled aria-label="지난 호 선택"><option>불러오는 중</option></select>
      <button id="next" type="button" disabled aria-label="다음 호"></button>
    </nav>
  </div>
</header>

  }
  function storyQuizState(s, si) {
    var qs = validQuiz(s), done = 0, right = 0;
    qs.forEach(function (q, qi) { var a = answers[si + "-" + qi]; if (a != null) { done++; if (a === q.answer) right++; } });
    return { total: qs.length, done: done, right: right };
  }

  function rerenderKeepScroll() { var y = window.scrollY; render(); window.scrollTo(0, y); setTopH(); }

  function renderQuiz(s, si) {
    var qs = validQuiz(s);
    if (!qs.length) return null;
    var st = storyQuizState(s, si);
    var box = el("section", { class: "quiz", "aria-label": "이해도 체크" }, [
      el("div", { class: "quiz-head" }, [
        el("span", { class: "t" }, [ic("bulb"), "이해도 체크"]),
        el("span", { class: "qbadge" + (st.done === st.total ? " done" : "") },
          [st.done === st.total ? st.right + "/" + st.total + " 정답" : st.total + "문제"])
      ])
    ]);
    qs.forEach(function (q, qi) {
      var key = si + "-" + qi, picked = answers[key];
      var item = el("div", { class: "qitem" }, [el("div", { class: "qtext", text: "Q" + (qi + 1) + ". " + str(q.q) })]);
      var opts = el("div", { class: "opts", role: "group", "aria-label": "Q" + (qi + 1) + " 보기" });
      arr(q.options).forEach(function (o, oi) {
        var b = el("button", { class: "opt", type: "button" }, [el("span", { class: "n", text: String(oi + 1) }), el("span", { text: str(o) })]);
        if (picked != null) {
          b.disabled = true;
          if (oi === q.answer) { b.classList.add("right"); b.appendChild(el("span", { class: "mark" }, [ic("check", "sm"), "정답"])); }
          else if (oi === picked) { b.classList.add("wrong"); b.appendChild(el("span", { class: "mark" }, [ic("x", "sm"), "내 선택"])); }
        }
        b.addEventListener("click", function () {
          if (answers[key] != null) return;
          answers[key] = oi; saveAnswers(); rerenderKeepScroll();
        });
        opts.appendChild(b);
      });
      item.appendChild(opts);
      if (picked != null) {
        var ok = picked === q.answer;
        item.appendChild(el("div", { class: "explain " + (ok ? "ok" : "no") }, [el("b", { text: ok ? "맞았어요!" : "아쉬워요" }), str(q.explain)]));
      }
      box.appendChild(item);
    });
    return box;
  }

  /* ---------- page ---------- */
  function showState(title, text) {
    mainEl.innerHTML = "";
    mainEl.appendChild(el("div", { class: "state" }, [el("strong", { text: title }), text]));
  }

  function renderNav() {
    pick.innerHTML = "";
    editions.forEach(function (e) {
      var o = el("option", { value: e.date, text: fmtShort(e.date) + " 호" });
      if (e.date === current) o.selected = true;
      pick.appendChild(o);
    });
    pick.disabled = editions.length === 0;
    var i = editions.findIndex(function (e) { return e.date === current; });
    prevBtn.disabled = i < 0 || i >= editions.length - 1;
    nextBtn.disabled = i <= 0;
  }

  function renderMarkets(list) {
    var box = el("div", { class: "markets", role: "list" });
    arr(list).forEach(function (m) {
      var dir = ["up", "down", "flat"].indexOf(m.dir) >= 0 ? m.dir : "flat";
      var arrow = dir === "up" ? "▲ " : dir === "down" ? "▼ " : "";
      box.appendChild(el("div", { class: "mk", role: "listitem" }, [
        el("span", { class: "mk-top" }, [el("span", { class: "mk-ic" }, [ic(marketIcon(m.label), "sm")]), str(m.label)]),
        el("span", { class: "mk-value", text: str(m.value) }),
        m.change ? el("span", { class: "mk-chg " + dirClass(dir), text: arrow + str(m.change) }) : null,
        m.note ? el("span", { class: "mk-note", text: str(m.note) }) : null
      ]));
    });
    return box;
  }

  function secTitle(icon, text) {
    return el("div", { class: "sec-title" }, [el("span", { class: "bubble sm" }, [ic(icon)]), el("h3", { text: text })]);
  }

  function renderGlance(e) {
    var qs = quizStats(e);
    var head = el("div", { class: "sec-head" }, [secTitle("grid", "한눈에 보기")]);
    if (qs.total) {
      var pct = Math.round(qs.right / qs.total * 100);
      var bar = el("span", { class: "score-bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(qs.total),
        "aria-valuenow": String(qs.right), "aria-label": "퀴즈 정답 수" }, [el("i")]);
      bar.firstChild.style.width = pct + "%";
      var reset = el("button", { class: "btn", type: "button" }, [ic("refresh", "sm"), "다시 풀기"]);
      reset.addEventListener("click", function () { answers = {}; saveAnswers(); rerenderKeepScroll(); });
      head.appendChild(el("div", { class: "score" }, [
        ic("star"), el("span", { text: "오늘의 이해도" }), bar,
        el("b", { text: qs.right + " / " + qs.total }),
        qs.answered ? reset : el("span", { class: "flat-t", text: "퀴즈를 풀어 보세요" })
      ]));
    }
    var grid = el("div", { class: "cards" });
    arr(e.stories).forEach(function (s, si) {
      var st = storyQuizState(s, si);
      var badge = st.total ? (st.done === st.total
        ? el("span", { class: "qbadge done" }, [ic("check", "sm"), st.right + "/" + st.total + " 정답"])
        : el("span", { class: "qbadge" }, [ic("bulb", "sm"), "퀴즈 " + st.total + "문제"])) : null;
      var c = el("button", { class: "card", type: "button", "data-cat": str(s.cat) }, [
        el("span", { class: "card-head" }, [el("span", { class: "bubble sm" }, [ic(CAT_ICON[s.cat] || "chart")]), el("span", { class: "cat", text: str(s.cat) })]),
        el("span", { class: "card-title", text: str(s.title) }),
        s.summary ? el("span", { class: "card-sum", text: str(s.summary) }) : null,
        el("span", { class: "card-foot" }, [el("span", null, ["자세히 보기"]), badge])
      ]);
      c.addEventListener("click", function () {
        if (activeCat !== "전체" && activeCat !== s.cat) { activeCat = "전체"; render(); }
        var t = document.getElementById("story-" + si);
        if (t) t.scrollIntoView({ block: "start" });
      });
      grid.appendChild(c);
    });
    return el("section", { class: "sec" }, [head, grid]);
  }

  function renderStory(s, si) {
    var src = el("div", { class: "src" }, [ic("link", "sm"), el("span", { text: "출처" })]);
    arr(s.sources).forEach(function (x) {
      var u = safeUrl(x && x.url);
      src.appendChild(u ? el("a", { href: u, target: "_blank", rel: "noopener", text: str(x.name) || "원문" })
                        : el("span", { text: str(x && x.name) }));
    });
    var figs = storyFigures(s).map(renderFigure).filter(Boolean);
    return el("article", { class: "story", id: "story-" + si, "data-cat": str(s.cat) }, [
      el("div", { class: "story-head" }, [
        el("span", { class: "bubble" }, [ic(CAT_ICON[s.cat] || "chart", "lg")]),
        el("div", null, [el("span", { class: "cat", text: str(s.cat) }), el("h3", { text: str(s.title) })])
      ]),
      figs.length ? el("div", { class: "figs" }, figs) : null,
      el("p", { text: str(s.body) }),
      s.why ? el("div", { class: "note why" }, [ic("target"), el("div", null, [el("b", { text: "왜 중요할까?" }), str(s.why)])]) : null,
      s.point ? el("div", { class: "note pt" }, [ic("pen"), el("div", null, [el("b", { text: "논술·면접 포인트" }), str(s.point)])]) : null,
      renderQuiz(s, si),
      arr(s.sources).length ? src : null
    ]);
  }

  function panel(icon, title, body) {
    return el("section", { class: "panel" }, [el("div", { class: "panel-head" }, [el("span", { class: "bubble" }, [ic(icon)]), el("h4", { text: title })]), body]);
  }

  function renderSearch() {
    var input = el("input", { id: "q", type: "search", placeholder: "금통위, 환율, 수출…", "aria-label": "지난 호 기사 검색" });
    input.value = query;
    var hits = el("ul", { class: "hits", "aria-live": "polite" });
    function run() {
      query = input.value.trim();
      hits.innerHTML = "";
      if (query.length < 2) return;
      var q = query.toLowerCase(), n = 0;
      editions.forEach(function (e) {
        arr(e.stories).forEach(function (s) {
          if (n >= 12) return;
          var hay = (str(s.title) + " " + str(s.body) + " " + str(s.cat)).toLowerCase();
          if (hay.indexOf(q) >= 0) {
            n++;
            var b = el("button", { type: "button" }, [
              el("span", { class: "h-date", text: fmtShort(e.date) + " · " + str(s.cat) }),
              el("span", { text: str(s.title) })
            ]);
            b.addEventListener("click", function () { go(e.date); });
            hits.appendChild(el("li", null, [b]));
          }
        });
      });
      if (!n) hits.appendChild(el("li", { class: "h-date", text: "일치하는 기사가 없어요." }));
    }
    var t; input.addEventListener("input", function () { clearTimeout(t); t = setTimeout(run, 200); });
    if (query) run();
    return panel("search", "지난 호 검색", el("div", null, [el("label", { class: "search-box", for: "q" }, [ic("search", "sm"), input]), hits]));
  }

  function render() {
    var e = editions.find(function (x) { return x.date === current; });
    if (!e) { renderNav(); showState("아직 발행된 호가 없어요", "첫 브리핑이 올라오면 이곳에 표시됩니다."); return; }
    mainEl.innerHTML = "";
    document.title = "경제시사 데일리 · " + fmtShort(e.date);

    mainEl.appendChild(el("section", { class: "hero" }, [
      el("span", { class: "pill mint" }, [ic("sun", "sm"), fmtDate(e.date) + " 브리핑"]),
      el("h2", { text: str(e.headline) }),
      el("p", { text: str(e.lede) })
    ]));
    if (arr(e.markets).length) {
      mainEl.appendChild(renderMarkets(e.markets));
      if (e.basis) mainEl.appendChild(el("p", { class: "basis", text: str(e.basis) }));
    }
    mainEl.appendChild(renderGlance(e));

    var stories = arr(e.stories);
    var present = CATS.filter(function (c) { return c === "전체" || stories.some(function (s) { return s.cat === c; }); });
    if (present.indexOf(activeCat) < 0) activeCat = "전체";
    var filters = el("div", { class: "filters", role: "group", "aria-label": "분야 필터" });
    present.forEach(function (c) {
      var b = el("button", { class: "chip", type: "button", "data-cat": c, "aria-pressed": String(c === activeCat) }, [ic(CAT_ICON[c] || "chart", "sm"), c]);
      b.addEventListener("click", function () {
        activeCat = c;
        rerenderKeepScroll();
        var r = document.getElementById("read");
        if (r && r.getBoundingClientRect().top < topBar.offsetHeight) r.scrollIntoView({ block: "start" });
        var on = document.querySelector('.chip[aria-pressed="true"]'), row = document.querySelector(".filters");
        if (on && row) row.scrollLeft = on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2;
      });
      filters.appendChild(b);
    });
    var list = el("div", { class: "stories" });
    stories.forEach(function (s, si) {
      if (activeCat === "전체" || s.cat === activeCat) list.appendChild(renderStory(s, si));
    });
    var col = el("div", { id: "read" }, [el("div", { class: "sec-head", style: "margin-bottom:4px" }, [secTitle("book", "자세히 읽기")]),
      el("div", { class: "tabbar" }, [filters]), list]);

    var side = el("aside");
    if (arr(e.terms).length) {
      var dl = el("dl");
      arr(e.terms).forEach(function (t) {
        dl.appendChild(el("div", null, [el("dt", { text: str(t.term) }), el("dd", { text: str(t.desc) })]));
      });
      side.appendChild(panel("book", "오늘의 경제 용어", dl));
    }
    if (arr(e.calendar).length) {
      var ul = el("ul", { class: "cal" });
      arr(e.calendar).forEach(function (c) {
        ul.appendChild(el("li", null, [el("span", { class: "when", text: str(c.when) }), el("span", { text: str(c.what) })]));
      });
      side.appendChild(panel("calendar", "다가오는 일정", ul));
    }
    side.appendChild(renderSearch());

    mainEl.appendChild(el("div", { class: "grid" }, [col, side]));
    renderNav();
  }

  function setCurrent(date) { current = date; answers = loadAnswers(date); }
  function go(date) {
    if (!editions.some(function (e) { return e.date === date; })) return;
    setCurrent(date); activeCat = "전체";
    if (location.hash.slice(1) !== date) { try { history.replaceState(null, "", "#" + date); } catch (err) { /* ignore */ } }
    render(); window.scrollTo(0, 0);
  }
  pick.addEventListener("change", function () { go(pick.value); });
  prevBtn.addEventListener("click", function () {
    var i = editions.findIndex(function (e) { return e.date === current; });
    if (i >= 0 && i < editions.length - 1) go(editions[i + 1].date);
  });
  nextBtn.addEventListener("click", function () {
    var i = editions.findIndex(function (e) { return e.date === current; });
    if (i > 0) go(editions[i - 1].date);
  });
  var wasNarrow = narrow(), rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { setTopH(); if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (current) rerenderKeepScroll(); } }, 150);
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (h && h !== current) go(h);
  });

  /* ---------- data: data/editions.json, plus Claude db when available ---------- */
  var fromFile = [], fromDb = [];
  function merge() {
    var byDate = {};
    fromFile.concat(fromDb).forEach(function (e) {
      if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(str(e.date))) return;
      var prev = byDate[e.date];
      if (!prev || str(e.updatedAt) > str(prev.updatedAt)) byDate[e.date] = e;
    });
    editions = Object.keys(byDate).sort().reverse().map(function (k) { return byDate[k]; });
    if (!editions.length) return false;
    var h = location.hash.slice(1);
    if (!current || !byDate[current]) setCurrent(byDate[h] ? h : editions[0].date);
    rerenderKeepScroll();
    return true;
  }

  var done = 0, total = 2;
  function settle() {
    done++;
    if (done >= total && !editions.length) showState("브리핑을 불러오지 못했어요", "인터넷 연결을 확인하고 잠시 뒤 다시 열어 주세요.");
  }
  var timer = setTimeout(function () {
    if (!editions.length) showState("브리핑을 아직 불러오지 못했어요", "인터넷 연결을 확인하고 잠시 뒤 다시 열어 주세요.");
  }, 10000);

  fetch("data/editions.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { fromFile = arr(j); if (merge()) clearTimeout(timer); })
    .catch(function () { /* file not present */ })
    .then(settle);

  var hasClaude = window.claude && typeof window.claude.use === "function";
  if (!hasClaude) { settle(); }
  else {
    window.claude.use("db").then(function (db) {
      if (!db) { settle(); return; }
      var first = true;
      db.collection("editions").orderBy("date", "desc").limit(120).onSnapshot(function (snap) {
        fromDb = snap.docs.map(function (d) { var v = d.data() || {}; return Object.assign({ date: d.id }, v); });
        if (merge()) clearTimeout(timer);
        if (first) { first = false; settle(); }
      }, function () { if (first) { first = false; settle(); } });
    }).catch(settle);
  }
})();
</script>
</body>
</html>
