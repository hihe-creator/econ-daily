<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경제시사 데일리</title>
<meta name="description" content="매일 아침 정리하는 경제 시사 브리핑: 한눈에 보는 핵심 뉴스, 도표, 이해도 퀴즈">
<meta name="theme-color" content="#0b5d4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: masthead → lead + market strip → "한눈에 보기" card grid with quiz score → detailed stories (figures, quiz) + side panels.
   Korean market colors: red = up, blue = down. Each news category has its own hue for quick scanning. */
:root {
  --paper: #f5f6f8;
  --surface: #ffffff;
  --ink: #14181f;
  --muted: #5a6370;
  --rule: #d8dce2;
  --accent: #0b5d4b;
  --accent-soft: #e3f0ec;
  --up: #c8342a;
  --down: #1f57c0;
  --bar-muted: #aab2bd;
  --ok: #1d7a46;
  --ok-soft: #e2f3e8;
  --bad: #b3261e;
  --bad-soft: #fbe7e5;
  --c-policy: #0b5d4b;
  --c-market: #8a3ffc;
  --c-fx: #b8620b;
  --c-trade: #00728f;
  --c-estate: #a2416f;
  --c-global: #3a56b8;
  --c-reg: #5b6b2a;
  --font-display: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1216; --surface: #171b21; --ink: #e7eaee; --muted: #9aa3ae;
    --rule: #2a3038; --accent: #56bfa2; --accent-soft: #15302a;
    --up: #ff6e62; --down: #6f9dff; --bar-muted: #4a525d;
    --ok: #5fd08f; --ok-soft: #143222; --bad: #ff8a80; --bad-soft: #3a1a18;
    --c-policy: #56bfa2; --c-market: #b48cff; --c-fx: #f0a04b; --c-trade: #45c3e0;
    --c-estate: #e488b5; --c-global: #8ea6ff; --c-reg: #b5c96a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1216; --surface: #171b21; --ink: #e7eaee; --muted: #9aa3ae;
  --rule: #2a3038; --accent: #56bfa2; --accent-soft: #15302a;
  --up: #ff6e62; --down: #6f9dff; --bar-muted: #4a525d;
  --ok: #5fd08f; --ok-soft: #143222; --bad: #ff8a80; --bad-soft: #3a1a18;
  --c-policy: #56bfa2; --c-market: #b48cff; --c-fx: #f0a04b; --c-trade: #45c3e0;
  --c-estate: #e488b5; --c-global: #8ea6ff; --c-reg: #b5c96a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 56px; }

/* Masthead */
.mast { display: grid; gap: 10px; padding: 28px 0 14px; border-bottom: 3px double var(--ink); }
.mast-top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between;
  font-size: 13px; color: var(--muted); }
.mast h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 48px);
  letter-spacing: -0.02em; line-height: 1.15; margin: 0; }
.mast h1 span { color: var(--accent); }
.nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.nav button, .nav select, .btn {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
.nav button:disabled { opacity: .4; cursor: default; }
.nav label { font-size: 13px; color: var(--muted); }

/* Lead */
.lead { padding: 26px 0 22px; display: grid; gap: 10px; }
.edition-date { font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
.lead h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 4vw, 34px);
  line-height: 1.3; margin: 0; text-wrap: balance; max-width: 30em; }
.lead p { margin: 0; max-width: 46em; font-size: 17px; }

/* Market strip */
.markets { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px;
  background: var(--rule); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.mk { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.mk-label { font-size: 12px; color: var(--muted); }
.mk-value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.mk-chg { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.up-t { color: var(--up); } .down-t { color: var(--down); } .flat-t { color: var(--muted); }
.mk-note { font-size: 11px; color: var(--muted); }
.basis { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* Category colors */
[data-cat="통화정책"] { --cat: var(--c-policy); }
[data-cat="금융시장"] { --cat: var(--c-market); }
[data-cat="외환"] { --cat: var(--c-fx); }
[data-cat="무역·산업"] { --cat: var(--c-trade); }
[data-cat="부동산"] { --cat: var(--c-estate); }
[data-cat="글로벌"] { --cat: var(--c-global); }
[data-cat="정책·규제"] { --cat: var(--c-reg); }
.cat { font-size: 12px; font-weight: 600; color: var(--cat, var(--accent)); display: inline-flex; align-items: center; gap: 6px; }
.cat::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cat, var(--accent)); }

/* At a glance */
.glance { margin-top: 30px; display: grid; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px;
  border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.sec-head h3 { font-family: var(--font-display); font-size: 20px; font-weight: 800; margin: 0; }
.score { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.score-bar { width: 140px; height: 8px; border-radius: 4px; background: var(--rule); overflow: hidden; }
.score-bar i { display: block; height: 100%; background: var(--ok); }
.score .btn { font-size: 13px; padding: 3px 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--rule);
  border-top: 4px solid var(--cat, var(--accent)); border-radius: 8px; padding: 12px 14px 12px;
  display: grid; gap: 6px; align-content: start; }
.card:hover { border-color: var(--cat, var(--accent)); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-title { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.45; text-wrap: balance; }
.card-sum { font-size: 14px; color: var(--muted); line-height: 1.55; }
.card-foot { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; }
.qbadge { font-weight: 600; }
.qbadge.done { color: var(--ok); }

/* Body grid */
.grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 36px; margin-top: 30px; }
@media (max-width: 860px) { .grid { grid-template-columns: 1fr; gap: 28px; } }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.story { padding: 26px 0; border-bottom: 1px solid var(--rule); display: grid; gap: 12px; scroll-margin-top: 12px; }
.story:last-child { border-bottom: 0; }
.story h3 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.4; margin: 0; text-wrap: balance; }
.story p { margin: 0; max-width: 42em; }
.box { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px;
  border-radius: 0 6px 6px 0; font-size: 15px; max-width: 42em; }
.box b { font-weight: 600; margin-right: 6px; }
.box.alt { background: transparent; border: 1px dashed var(--rule); border-left: 3px solid var(--ink); }
.src { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }

/* Figures */
.figs { display: grid; gap: 10px; max-width: 42em; }
.fig { margin: 0; padding: 14px 16px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.fig figcaption { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.fig svg { display: block; width: 100%; height: auto; }
.fig svg text { font-family: var(--font-body); fill: var(--ink); }
.fig svg .t-muted { fill: var(--muted); }
.fig svg .t-num { font-variant-numeric: tabular-nums; font-weight: 600; }
.fig svg .t-big { font-variant-numeric: tabular-nums; font-weight: 600; }
.fig svg .grid-line { stroke: var(--rule); stroke-width: 1; }
.fig svg .axis { stroke: var(--muted); stroke-width: 1; }
.fill-up { fill: var(--up); } .fill-down { fill: var(--down); }
.fill-accent { fill: var(--accent); } .fill-muted { fill: var(--bar-muted); }
.stroke-accent { stroke: var(--accent); }
.fig-note { font-size: 13px; color: var(--muted); margin: 8px 0 0; max-width: none; }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flow li { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.flow .step { background: var(--accent-soft); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; }
.flow li:last-child .step { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.flow .arr { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
.stat-l { font-size: 12px; color: var(--muted); }
.stat-v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.3; }
.stat-s { font-size: 12px; color: var(--muted); }
.cmp { display: grid; gap: 8px; }
.cmp-row { display: grid; grid-template-columns: minmax(90px, 1.2fr) auto auto auto; align-items: baseline; gap: 4px 12px; font-size: 15px; }
.cmp-l { color: var(--muted); font-size: 14px; }
.cmp-from { color: var(--muted); font-variant-numeric: tabular-nums; }
.cmp-arr { color: var(--muted); }
.cmp-to { font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.cmp-note { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -4px; }
@media (max-width: 480px) { .cmp-row { grid-template-columns: 1fr auto auto auto; } }

/* Quiz */
.quiz { border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 14px 16px; max-width: 42em; display: grid; gap: 14px; }
.quiz-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.quiz-head b { font-size: 15px; }
.quiz-head span { font-size: 13px; color: var(--muted); }
.qitem { display: grid; gap: 8px; }
.qtext { font-weight: 600; font-size: 15px; }
.opts { display: grid; gap: 6px; }
.opt { font: inherit; font-size: 14px; text-align: left; cursor: pointer; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; display: flex; gap: 8px; align-items: baseline; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt .mark { margin-left: auto; font-weight: 600; font-size: 13px; }
.opt.right .mark { color: var(--ok); } .opt.wrong .mark { color: var(--bad); }
.explain { font-size: 14px; border-left: 3px solid var(--rule); padding: 2px 10px; color: var(--ink); }
.explain b { margin-right: 6px; }
.explain.ok b { color: var(--ok); } .explain.no b { color: var(--bad); }

aside { display: grid; gap: 28px; align-content: start; }
.panel h4 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0 0 8px;
  padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.panel dl { margin: 0; display: grid; gap: 12px; }
.panel dt { font-weight: 600; font-size: 15px; }
.panel dd { margin: 2px 0 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
.cal { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cal li { display: grid; grid-template-columns: 88px 1fr; gap: 8px; font-size: 14px; }
.cal .when { font-weight: 600; font-variant-numeric: tabular-nums; }
.search input { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 6px;
  border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
.hits { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.hits button { all: unset; cursor: pointer; color: var(--ink); display: block; }
.hits button:hover .h-title { text-decoration: underline; }
.hits button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.h-date { font-size: 12px; color: var(--muted); display: block; }

.state { padding: 48px 0; color: var(--muted); max-width: 36em; }
.state strong { color: var(--ink); display: block; font-size: 18px; margin-bottom: 6px; }
footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <span>금리 · 환율 · 증시 · 부동산 · 무역 · 글로벌</span>
      <nav class="nav" aria-label="호 이동">
        <button id="prev" type="button" disabled>← 이전 호</button>
        <label for="pick">지난 호</label>
        <select id="pick" disabled><option>불러오는 중</option></select>
        <button id="next" type="button" disabled>다음 호 →</button>
      </nav>
    </div>
    <h1>경제시사 <span>데일리</span></h1>
  </header>

  <main id="main">
    <div class="state"><strong>오늘의 브리핑을 불러오는 중입니다.</strong>잠시만 기다려 주세요.</div>
  </main>

  <footer>
    매일 아침 새 호가 발행됩니다. 경제 시사만 다루며, 각 기사 아래에 원문 출처를 달았습니다. 그림은 기사 수치로 직접 그린 설명용 도표이고, 퀴즈 기록은 이 기기의 브라우저에만 저장됩니다. 수치는 발행 시점 보도 기준이니 중요한 판단 전에는 원문을 확인하세요.
  </footer>
</div>

<script>
(function () {
  "use strict";
  var CATS = ["전체", "통화정책", "금융시장", "외환", "무역·산업", "부동산", "글로벌", "정책·규제"];
  var editions = [];
  var current = null;
  var activeCat = "전체";
  var query = "";
  var answers = {};          // { "storyIdx-qIdx": choiceIdx } for the current edition
  var mainEl = document.getElementById("main");
  var pick = document.getElementById("pick");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var SVGNS = "http://www.w3.org/2000/svg";

  /* ---------- helpers ---------- */
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function sv(tag, attrs, text) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function str(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function num(v) { var n = Number(v); return isFinite(n) ? n : null; }
  function safeUrl(u) { u = str(u); return /^https?:\/\//i.test(u) ? u : null; }
  function fmtNum(v) {
    var a = Math.abs(v);
    var s = a >= 100 ? a.toLocaleString("ko-KR", { maximumFractionDigits: 1 }) : String(Math.round(a * 100) / 100);
    return (v < 0 ? "−" : "") + s;
  }
  function dirClass(d) { return d === "up" ? "up-t" : d === "down" ? "down-t" : "flat-t"; }
  function narrow() { return window.innerWidth < 560; }
  var TONES = { up: "fill-up", down: "fill-down", accent: "fill-accent", muted: "fill-muted" };

  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  function fmtDate(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
    if (!m) return str(d);
    var dt = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return m[1] + "년 " + (+m[2]) + "월 " + (+m[3]) + "일 (" + WD[dt.getUTCDay()] + ")";
  }

  /* ---------- storage (quiz answers; optional, per device) ---------- */
  function loadAnswers(date) {
    try { return JSON.parse(localStorage.getItem("econ-quiz-" + date) || "{}") || {}; } catch (e) { return {}; }
  }
  function saveAnswers() {
    try { localStorage.setItem("econ-quiz-" + current, JSON.stringify(answers)); } catch (e) { /* storage unavailable */ }
  }

  /* ---------- figures ---------- */
  function figBars(f) {
    var items = arr(f.items).filter(function (i) { return num(i.value) !== null; });
    if (!items.length) return null;
    var nw = narrow();
    var W = nw ? 380 : 640, rowH = 34, labelW = nw ? 84 : 118, valW = nw ? 100 : 110, top = 6;
    var H = top + items.length * rowH + 6;
    var vals = items.map(function (i) { return num(i.value); });
    var maxPos = Math.max(0, Math.max.apply(null, vals));
    var maxNeg = Math.max(0, -Math.min.apply(null, vals));
    var signed = maxNeg > 0;
    var x0 = labelW, x1 = W - valW, span = (maxPos + maxNeg) || 1;
    var zeroX = x0 + (x1 - x0) * (maxNeg / span), scale = (x1 - x0) / span;
    var svg = sv("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": str(f.title) });
    items.forEach(function (it, i) {
      var v = num(it.value), y = top + i * rowH;
      var w = Math.max(2, Math.abs(v) * scale);
      var x = v >= 0 ? zeroX : zeroX - w;
      var tone = TONES[it.tone] || (signed ? (v >= 0 ? TONES.up : TONES.down) : (it.highlight ? TONES.accent : TONES.muted));
      svg.appendChild(sv("text", { x: labelW - 10, y: y + rowH / 2 + 5, "text-anchor": "end", "font-size": 14 }, str(it.label)));
      svg.appendChild(sv("rect", { x: x, y: y + 7, width: w, height: rowH - 14, rx: 3, "class": tone }));
      svg.appendChild(sv("text", { x: W - 4, y: y + rowH / 2 + 5, "text-anchor": "end", "font-size": 14, "class": "t-num" },
        it.display ? str(it.display) : fmtNum(v) + (f.unit ? " " + str(f.unit) : "")));
    });
    if (signed) svg.appendChild(sv("line", { x1: zeroX, x2: zeroX, y1: 2, y2: H - 2, "class": "axis" }));
    return svg;
  }

  function figLine(f) {
    var pts = arr(f.points).filter(function (p) { return num(p.value) !== null; });
    if (pts.length < 2) return null;
    var nw = narrow();

    return { total: t, done: done, right: right };

  function renderQuiz(s, si, onChange) {

  prevBtn.addEventListener("click", function () {
    var i = editions.findIndex(function (e) { return e.date === current; });
    if (i >= 0 && i < editions.length - 1) go(editions[i + 1].date);
  });
  nextBtn.addEventListener("click", function () {
    var i = editions.findIndex(function (e) { return e.date === current; });
    if (i > 0) go(editions[i - 1].date);
  });
  var wasNarrow = narrow(), rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (narrow() !== wasNarrow) { wasNarrow = narrow(); if (current) { var y = window.scrollY; render(); window.scrollTo(0, y); } } }, 150);
  });
  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (h && h !== current) go(h);
  });

  /* ---------- data: data/editions.json, plus Claude db when available ---------- */
  var fromFile = [], fromDb = [];
  function merge() {
    var byDate = {};
    fromFile.concat(fromDb).forEach(function (e) {
      if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(str(e.date))) return;
      var prev = byDate[e.date];
      if (!prev || str(e.updatedAt) > str(prev.updatedAt)) byDate[e.date] = e;
    });
    editions = Object.keys(byDate).sort().reverse().map(function (k) { return byDate[k]; });
    if (!editions.length) return false;
    var h = location.hash.slice(1);
    if (!current || !byDate[current]) setCurrent(byDate[h] ? h : editions[0].date);
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);
    return true;
  }

  var done = 0, total = 2;
  function settle() {
    done++;
    if (done >= total && !editions.length) showState("브리핑을 불러오지 못했습니다.", "인터넷 연결을 확인하고 잠시 뒤 다시 열어 주세요.");
  }
  var timer = setTimeout(function () {
    if (!editions.length) showState("브리핑을 아직 불러오지 못했습니다.", "인터넷 연결을 확인하고 잠시 뒤 다시 열어 주세요.");
  }, 10000);

  fetch("data/editions.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { fromFile = arr(j); if (merge()) clearTimeout(timer); })
    .catch(function () { /* file not present */ })
    .then(settle);

  var hasClaude = window.claude && typeof window.claude.use === "function";
  if (!hasClaude) { settle(); }
  else {
    window.claude.use("db").then(function (db) {
      if (!db) { settle(); return; }
      var first = true;
      db.collection("editions").orderBy("date", "desc").limit(120).onSnapshot(function (snap) {
        fromDb = snap.docs.map(function (d) { var v = d.data() || {}; return Object.assign({ date: d.id }, v); });
        if (merge()) clearTimeout(timer);
        if (first) { first = false; settle(); }
      }, function () { if (first) { first = false; settle(); } });
    }).catch(settle);
  }
})();
</script>
</body>
</html>
